<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>短横线颜色</title>
  <link rel="stylesheet" href="popup.css">
  <script src="colors.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>短横线颜色</h1>
  <p class="intro">选择颜色，已打开的聊天页面即时生效。</p>
  <div class="field">
    <label for="tick">普通短横线</label>
    <output id="tick-value" for="tick"></output>
    <input id="tick" type="color" aria-label="普通短横线颜色" disabled>
  </div>
  <div class="field">
    <label for="active">当前提问 / 悬停</label>
    <output id="active-value" for="active"></output>
    <input id="active" type="color" aria-label="高亮短横线颜色" disabled>
  </div>
  <div class="preview" aria-label="颜色预览">
    <span class="sample"></span><span class="sample selected"></span><span class="sample"></span>
    <span class="preview-label">导航预览</span>
  </div>
  <footer>
    <button id="reset" type="button" disabled>恢复默认</button>
    <span id="status" role="status" aria-live="polite">正在读取…</span>
  </footer>
  <p class="note">颜色仅保存在此浏览器。默认配色跟随页面深浅色；自定义颜色在两种主题下保持一致。</p>
</body>
</html>
